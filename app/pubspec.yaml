name: ironforge
description: "IronForge — your private 3-month gym plan, form guides and progress tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.6.1
  fl_chart: ^1.1.1
  url_launcher: ^6.3.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/gifs/
  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf
